# ---------------------------------------------------------------------------
# Local development / demo stack.
#
#   docker compose up --build
#   docker compose exec app npm run db:seed
#
# The application waits for PostgreSQL and applies migrations on start-up.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: him
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d him"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/him?schema=public
      AUTH_SECRET: change-this-to-a-long-random-string-at-least-32-chars
      SESSION_COOKIE_NAME: him_session
      COOKIE_SECURE: "false"
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
      LOG_JSON: "false"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: storage/uploads
      SEED_PASSWORD: DemoPass123!
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  uploads:
